<h2>Latest submissions</h2><table class="table"><thead><tr><th>Team</th><th>Problem</th><th>Result</th></tr></thead><tbody>{% for item in arena.allRecords %}<tr><td>{{ item.team }}</td><td>{{ item.label }}</td><td><a href="{{ item.url }}">{{ item.verdict }}</a></td></tr>{% else %}<tr><td colspan="3" class="nodata">No submissions.</td></tr>{% endfor %}</tbody></table>
