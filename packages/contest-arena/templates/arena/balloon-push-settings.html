<dialog class="balloon-dialog balloon-push-dialog" data-push-dialog aria-labelledby="balloon-push-title"><form data-push-form>
  <div class="balloon-dialog-heading"><h2 id="balloon-push-title">WxPusher 通知与发放员</h2><button type="button" data-push-close aria-label="关闭通知设置">×</button></div>
  <div class="balloon-dialog-body"><div class="balloon-push-switch"><label><input type="checkbox" data-push-enabled> 启用轮转通知</label><span data-next-runner></span></div>
    <label class="balloon-push-url">手机访问的 OJ 地址<input type="url" class="textbox" data-push-base required placeholder="https://www.hgnu.org"></label>
    <div class="balloon-push-list-heading"><span>按列表顺序轮流分配，新产生的气球开始推送。</span><button type="button" class="rounded button" data-add-runner>添加发放员</button></div>
    <div class="balloon-push-empty" data-push-empty>尚未添加发放员</div><div data-push-runners></div><div class="balloon-error" role="alert" data-push-error hidden></div><div class="balloon-notice" role="status" data-push-notice hidden></div>
  </div><div class="balloon-dialog-footer"><span></span><button type="button" class="rounded button" data-push-close>取消</button><button type="submit" class="primary rounded button" data-push-save>保存通知设置</button></div>
</form></dialog>
<dialog class="balloon-dialog balloon-confirm-dialog" data-push-action-dialog aria-labelledby="balloon-push-action-title"><form data-push-action-form><div class="balloon-dialog-heading"><h2 id="balloon-push-action-title" data-push-action-title>气球通知</h2><button type="button" data-push-action-close aria-label="取消气球通知操作">×</button></div><div class="balloon-dialog-body"><p data-push-action-message></p><label data-transfer-label>新的发放员<select class="select" data-transfer-runner></select></label><div class="balloon-error" role="alert" data-push-action-error hidden></div></div><div class="balloon-dialog-footer"><span></span><button type="button" class="rounded button" data-push-action-close>取消</button><button type="submit" class="primary rounded button" data-push-action-submit>确认</button></div></form></dialog>
