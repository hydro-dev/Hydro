<h2>Balloons</h2><table class="table"><thead><tr><th>Team</th><th>Problem</th><th>Status</th></tr></thead><tbody>{% for balloon in arena.balloons %}<tr><td>{{ balloon.team }}</td><td>{{ balloon.label }}</td><td>{% if balloon.sent %}Delivered{% else %}<form method="post" data-arena-form><input type="hidden" name="csrf" value="{{ arena.csrf }}"><input type="hidden" name="operation" value="balloon"><input type="hidden" name="id" value="{{ balloon.id }}"><button type="submit" class="btn btn-secondary btn-sm">Mark delivered</button></form>{% endif %}</td></tr>{% else %}<tr><td colspan="3" class="nodata">No balloons.</td></tr>{% endfor %}</tbody></table>
