services:
  # Warning: mongodb here is not password-protected.
  # DO NOT EXPOSE THIS SERVICE TO THE PUBLIC.
  oj-mongo:
    image: mongo:7-jammy
    container_name: oj-mongo
    restart: always
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  oj-backend:
    image: ghcr.io/hydro-dev/hydro-backend:latest
    container_name: oj-backend
    restart: always
    pull_policy: always
    depends_on:
      oj-mongo:
        condition: service_healthy
        restart: true
    volumes:
      - ./data/file:/data/file
      - ./data/backend:/root/.hydro
    ports:
      - "40015:8888"
    healthcheck:
      test: curl --silent --fail http://localhost:8888/status >/dev/null || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    ulimits:
      stack:
        soft: -1
        hard: -1

  oj-judge:
    image: ghcr.io/hydro-dev/hydro-judge:latest
    container_name: oj-judge
    restart: always
    pull_policy: always
    privileged: true
    depends_on:
      oj-backend:
        condition: service_healthy
        restart: true
    volumes:
      - ./judge/judge.yaml:/root/.hydro/judge.yaml
      - ./judge/mount.yaml:/root/.hydro/mount.yaml
    ulimits:
      stack:
        soft: -1
        hard: -1
